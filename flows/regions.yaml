appId: com.sample.browserstack.samplecalculator
env:
  PERCY_DEVICE_NAME: "Samsung Galaxy S22"
  PERCY_OS_VERSION: "13"
  PERCY_SCREEN_WIDTH: "1080"
  PERCY_SCREEN_HEIGHT: "2340"
  PERCY_ORIENTATION: "portrait"
---
- launchApp

# Snapshot 1 — coordinate-based region.
# Masks the device status bar (top 50 px). Anything above y=50 is ignored.
- runFlow:
    file: percy/flows/percy-screenshot.yaml
    env:
      SCREENSHOT_NAME: "Regions — coordinate"
      PERCY_REGIONS: '[{"top":0,"bottom":50,"left":0,"right":1080,"algorithm":"ignore"}]'

# Snapshot 2 — element-based region.
# Masks the calculator's result display, whose value changes between runs.
- tapOn: "5"
- tapOn: "+"
- tapOn: "3"
- tapOn: "="
- runFlow:
    file: percy/flows/percy-screenshot.yaml
    env:
      SCREENSHOT_NAME: "Regions — element"
      PERCY_REGIONS: '[{"element":{"resource-id":"com.sample.browserstack.samplecalculator:id/editText"},"algorithm":"ignore"}]'
