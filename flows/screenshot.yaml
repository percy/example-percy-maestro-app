appId: com.sample.browserstack.samplecalculator
env:
  PERCY_ORIENTATION: "portrait"
---
# On BrowserStack App Automate, device metadata (PERCY_DEVICE_NAME,
# PERCY_OS_VERSION, PERCY_SCREEN_WIDTH, PERCY_SCREEN_HEIGHT) is auto-injected
# by the BS host runner — no need to hardcode them here. Same for
# PERCY_SESSION_ID and PERCY_SERVER. Customers running self-hosted Maestro
# (Maestro Cloud, local CI, customer device labs) MUST still set those 4
# device-metadata vars manually in this `env:` block.
#
# PERCY_ORIENTATION is intentionally customer-owned because orientation is
# a per-snapshot property, not a per-device property.

- launchApp

# Wait for the app's root layout before the first screenshot — without this,
# app-launch lag can leave the device home screen (or a splash frame) in the
# Calculator_launch snapshot. activity_main is the root layout id from
# app/src/main/res/layout/activity_main.xml.
- extendedWaitUntil:
    visible:
      id: "com.sample.browserstack.samplecalculator:id/activity_main"
    timeout: 15000

# Snapshot 1: launch screen
- runFlow:
    file: percy/flows/percy-screenshot.yaml
    env:
      SCREENSHOT_NAME: "Calculator_launch"

# Snapshot 2: after entering 12 + 34 =
- tapOn: "1"
- tapOn: "2"
- tapOn: "+"
- tapOn: "3"
- tapOn: "4"
- tapOn: "="
- runFlow:
    file: percy/flows/percy-screenshot.yaml
    env:
      SCREENSHOT_NAME: "Calculator_result"
